<style>
html,body{margin:0;height:100%;background:#0E0B0A;color:#F3EBDD;font-family:"Hiragino Sans","Yu Gothic UI",sans-serif}
.g{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse 60% 50% at 50% 30%,#3A0912,#0E0B0A 70%)}

.err{color:#F2A0A8;min-height:1.6em}
